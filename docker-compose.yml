services:
  zorya:
    build: .
    container_name: zorya
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: "0.0.0.0"
      VAPID_SUBJECT: mailto:admin@sietch.lan
      ZORYA_DATA_DIR: /app/data
      ZORYA_ARCHIVE_DAYS: "180"
      # MAPA.UA missile layer; set MAPAUA_ENABLED=0 in .env and `docker compose up -d` to switch it off.
      MAPAUA_ENABLED: ${MAPAUA_ENABLED:-1}
    volumes:
      - ./data:/app/data

  zorya-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: zorya-tunnel
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    # token only via env — not argv
    command: tunnel --no-autoupdate run
    depends_on:
      - zorya
