services:
  zorya:
    build: .
    container_name: zorya
    restart: unless-stopped
    ports:
      # Loopback only: cloudflared (host network) and local tools reach 127.0.0.1:8787; nothing on the LAN/internet directly.
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: "0.0.0.0"
      VAPID_SUBJECT: mailto:admin@sietch.lan
      ZORYA_DATA_DIR: /app/data
      ZORYA_ARCHIVE_DAYS: "180"
      # MAPA.UA missile layer; set MAPAUA_ENABLED=0 in .env and `docker compose up -d` to switch it off.
      MAPAUA_ENABLED: ${MAPAUA_ENABLED:-1}
      # Own UA air-threat tracker (public Telegram previews, server/uatracker); 0 switches the own ingest off.
      UA_TRACKER_ENABLED: ${UA_TRACKER_ENABLED:-1}
      # Fallback layers, used only where the own engine has nothing nearby; 0 switches each off.
      UA_TRACKER_FALLBACK_MAPAUA: ${UA_TRACKER_FALLBACK_MAPAUA:-1}
      UA_TRACKER_FALLBACK_NEPTUN: ${UA_TRACKER_FALLBACK_NEPTUN:-1}
      # NOTAM layer (FAA NOTAM Search, FIR EPWW, every 30 min); 0 switches it off.
      ZORYA_NOTAM_ENABLED: ${ZORYA_NOTAM_ENABLED:-1}
      ZORYA_NOTAM_LOCATIONS: ${ZORYA_NOTAM_LOCATIONS:-EPWW}
      # Optional: permanent P/R/D/TSA/TRA areas from OpenAIP (free key), extra local-alert feeds (JSON),
      # and a shared secret for the LAN-only drone archive. Keep the values in .env, not here.
      OPENAIP_API_KEY: ${OPENAIP_API_KEY:-}
      ZORYA_LOCAL_FEEDS: ${ZORYA_LOCAL_FEEDS:-}
      ZORYA_ARCHIVE_TOKEN: ${ZORYA_ARCHIVE_TOKEN:-}
    volumes:
      - ./data:/app/data

  zorya-tunnel:
    # Pinned; bump deliberately (https://github.com/cloudflare/cloudflared/releases).
    image: cloudflare/cloudflared:2026.10.0
    container_name: zorya-tunnel
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    # token only via env — not argv
    command: tunnel --no-autoupdate run
    depends_on:
      - zorya
